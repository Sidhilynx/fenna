name: Bug
description: Something in Fenna doesn't work as it should
labels: [bug, triage]
body:
  - type: dropdown
    id: app
    attributes:
      label: App
      options: [Fenna Slides, Fenna Docs, Fenna Sheets, Fenna Whiteboard, The MCP server (any app)]
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version and system
      placeholder: "0.9.0 on Windows 11 / macOS 15 (Apple silicon) / Ubuntu 24.04"
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, step by step; what you expected; what happened instead. Screenshots help.
    validations:
      required: true
  - type: textarea
    id: file
    attributes:
      label: A file that shows it (optional)
      description: Zip the document's folder and attach it. Remove anything private first.
