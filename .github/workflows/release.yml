# Builds the four apps for Windows, macOS and Linux when a version tag is
# pushed (git tag v0.9.0 && git push origin v0.9.0), and puts every installer
# on a DRAFT GitHub release. Nothing is public until someone presses Publish
# on that draft; the apps' update check never sees drafts.
name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

jobs:
  check:
    uses: ./.github/workflows/ci.yml

  build:
    needs: check
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: --win
          - os: macos-latest
            target: --mac --x64 --arm64
          - os: ubuntu-latest
            target: --linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: The tag matches every app's version
        shell: bash
        run: node scripts/release-version.mjs "${GITHUB_REF_NAME}"
      - name: Build installers
        shell: bash
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: |
          for app in desktop docs sheets whiteboard; do
            npm run dist -w "@opendeck/$app" -- ${{ matrix.target }} --publish never
          done
      - uses: actions/upload-artifact@v4
        with:
          name: installers-${{ matrix.os }}
          if-no-files-found: error
          path: |
            apps/*/release/Fenna-*-setup.exe
            apps/*/release/Fenna-*.dmg
            apps/*/release/Fenna-*.AppImage
            apps/*/release/Fenna-*.deb

  draft:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - name: Draft the release with every installer
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          find out -type f -name 'Fenna-*' > files.txt
          cat files.txt
          gh release create "$GITHUB_REF_NAME" --draft --verify-tag \
            --title "Fenna ${GITHUB_REF_NAME#v}" --generate-notes $(cat files.txt)
